name: spendly-codespaces

services:
  workspace:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    init: true
    command: sleep infinity
    volumes:
      - ..:/workspaces/spendly-budget-tracker:cached
    environment:
      APP_ENV: development
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: spendly
      DB_USER: spendly_app
      # Disposable Codespaces-only credential. Never reuse outside this dev database.
      DB_PASSWORD: spendly-codespaces-app-dev-only
      BACKEND_URL: http://127.0.0.1:8000
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4.9
    environment:
      MYSQL_DATABASE: spendly
      MYSQL_USER: spendly_app
      # Disposable Codespaces-only credential. Never reuse outside this dev database.
      MYSQL_PASSWORD: spendly-codespaces-app-dev-only
      # Disposable local container administrator credential; not a real account secret.
      MYSQL_ROOT_PASSWORD: spendly-codespaces-root-dev-only
    volumes:
      - spendly_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          mysql --protocol=TCP --host=127.0.0.1
          --user="$${MYSQL_USER}"
          --password="$${MYSQL_PASSWORD}"
          --database="$${MYSQL_DATABASE}"
          --execute="SELECT 1" >/dev/null 2>&1
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

volumes:
  spendly_mysql_data:
    name: spendly-codespaces-mysql-data
