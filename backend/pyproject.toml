[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "spendly-backend"
version = "0.1.0"
description = "Spendly API foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.121.3",
    "pydantic-settings==2.12.0",
    "pymysql==1.1.2",
    "sqlalchemy==2.0.44",
    "uvicorn[standard]==0.38.0",
]

[project.optional-dependencies]
dev = [
    "httpx==0.28.1",
    "pytest==9.0.1",
    "ruff==0.14.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
